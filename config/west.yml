# 依存はすべて固定リビジョンで参照する。
# ブランチ追従にすると上流の破壊的変更でビルドが突然壊れるため、
# 更新するときは意図してここを書き換える。
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: razilyis
      url-base: https://github.com/razilyis
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: razilyis
      # zmk-0.3 ブランチ (ZMK v0.3 / Zephyr 3.5 向け) の先頭。
      # main / zmk-0.4 は ZMK v0.4 用で compatible が pixart,pmw3610-alt に変わるため使わない。
      revision: 5c5af40de4d8cdf55dc63c4c5907af1e52da6a95
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3.0
  self:
    path: config
